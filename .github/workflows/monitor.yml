name: HasuLivePhoto Gacha Monitor

on:
  schedule:
    # Runs every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manually triggering the run from GitHub UI

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          #cache: 'pip' # Works now that requirements.txt exists

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium with dependencies
        run: |
          npx playwright install chromium --with-deps

      - name: Restore previous state cache
        uses: actions/cache@v4
        with:
          path: state.json
          key: gacha-state-${{ github.run_id }}
          restore-keys: |
            gacha-state-

      - name: Run Monitoring Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        run: |
          python gacha_discord_monitor.py

      - name: Save updated state back to cache
        uses: actions/cache@v4
        with:
          path: state.json
          key: gacha-state-${{ github.run_id }}
