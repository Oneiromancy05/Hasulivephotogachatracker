name: HasuLivePhoto Gacha Monitor

on:
  repository_dispatch:
    types: [trigger_monitor]
  workflow_dispatch:

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Speeds up pip install

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Cache Playwright browser binaries so they aren't re-downloaded every time
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/requirements.txt') }}

      - name: Install Playwright Chromium with dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          npx playwright install chromium --with-deps

      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: state.json
          key: gacha-state-cache

      - name: Run Monitoring Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        run: |
          python gacha_discord_monitor.py

      - name: Save state cache
        uses: actions/cache@v4
        with:
          path: state.json
          key: gacha-state-cache
